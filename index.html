<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Budget à enveloppes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : appli mobile en une colonne, alignée à gauche. Une carte corail signature pour le reste à vivre, le reste calme ; barre de navigation flottante prune avec le + au centre. */
:root{
  --bg:#FCEEF3; --surface:#FFFFFF; --sunk:#F8E3EB; --ink:#2A1A27; --muted:#7D6577; --line:#F1D8E2; --dot:#F3B9CE;
  --hero:#FF5B3A; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.22);
  --nav:#241C38; --nav-ink:#B9B1CC; --nav-on:#FFFFFF;
  --ok:#1E9E6A; --warn:#D98200; --bad:#E0392B; --bad-soft:#FDE8E5; --warn-soft:#FFF2DC;
  --shadow:0 1px 2px rgba(31,26,46,.04),0 8px 24px rgba(31,26,46,.06);
  --c1:#FF5B3A; --c2:#6C4CF1; --c3:#1FB5A3; --c4:#F5A623; --c5:#E64C8C; --c6:#3A8DFF; --c7:#8BC34A; --c8:#A35CD6; --c9:#FF8A65; --c10:#5E6B8C; --c11:#B4ADC4;
  --e1:#FFE1D8; --e2:#E4DDFF; --e3:#D3F3EE; --e4:#FFEDCC; --e5:#FCDCEA; --e6:#DAE9FF;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1218; --surface:#271B23; --sunk:#34242E; --ink:#F8EEF3; --muted:#B79DAD; --line:#3B2A35; --dot:#4C2A3D;
  --hero:#FF6447; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.2);
  --nav:#2A2340; --nav-ink:#9D94B5; --nav-on:#FFFFFF;
  --ok:#3BC98C; --warn:#F5A623; --bad:#FF6B5C; --bad-soft:#3B1D1F; --warn-soft:#3A2C14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c1:#FF7A5C; --c2:#9580FF; --c3:#3FD1BE; --c4:#FFBE4D; --c5:#FF73AA; --c6:#66A8FF; --c7:#A5D66A; --c8:#C08AF0; --c9:#FFA587; --c10:#8E9AB8; --c11:#7E778F;
  --e1:#4A2A22; --e2:#2F2752; --e3:#1C3F3B; --e4:#463717; --e5:#4A2236; --e6:#1F3150;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1218; --surface:#271B23; --sunk:#34242E; --ink:#F8EEF3; --muted:#B79DAD; --line:#3B2A35; --dot:#4C2A3D;
  --hero:#FF6447; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.2);
  --nav:#2A2340; --nav-ink:#9D94B5; --nav-on:#FFFFFF;
  --ok:#3BC98C; --warn:#F5A623; --bad:#FF6B5C; --bad-soft:#3B1D1F; --warn-soft:#3A2C14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c1:#FF7A5C; --c2:#9580FF; --c3:#3FD1BE; --c4:#FFBE4D; --c5:#FF73AA; --c6:#66A8FF; --c7:#A5D66A; --c8:#C08AF0; --c9:#FFA587; --c10:#8E9AB8; --c11:#7E778F;
  --e1:#4A2A22; --e2:#2F2752; --e3:#1C3F3B; --e4:#463717; --e5:#4A2236; --e6:#1F3150;
  color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 3.5px,transparent 4px),radial-gradient(var(--dot) 3.5px,transparent 4px);background-size:30px 30px;background-position:0 0,15px 15px;color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 120px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{margin:0;text-wrap:balance}
h2{font-size:1.08rem;font-weight:800;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--c2);outline-offset:2px}
.muted{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* En-tête */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-inline:-16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px}
.top-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.month{display:flex;align-items:center;gap:2px}
.month h1{font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:-.01em;padding:0 6px;white-space:nowrap}
.month h1 span{color:var(--muted);font-weight:500}
.arrow{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.arrow:hover{background:var(--sunk);color:var(--ink)}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Carte signature */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;border:28px solid var(--hero-soft);pointer-events:none}
.hero .lab{font-size:.9rem;font-weight:600;opacity:.9}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,11vw,3.1rem);line-height:1;letter-spacing:-.03em;margin-top:6px}
.hero .big small{font-size:.5em;font-weight:500;opacity:.85;margin-left:2px}
.hero .meter{height:8px;border-radius:99px;background:var(--hero-soft);overflow:hidden}
.hero .meter i{display:block;height:100%;background:var(--hero-ink);border-radius:99px}
.hero .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero .trio div{display:flex;flex-direction:column;min-width:0}
.hero .trio span{font-size:.78rem;opacity:.85}
.hero .trio b{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero.neg{background:var(--ink);color:var(--bg)}
.hero.neg .meter i{background:var(--bad)}

/* Sections */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-head .tot{font-weight:800}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.link{border:0;background:none;color:var(--c2);font-weight:700;padding:0;font-size:.9rem}

/* Alertes */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;font-size:.9rem;background:var(--bad-soft)}
.alert .ic{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.alert.warn{background:var(--warn-soft)}
.alert.warn .ic{background:var(--warn)}
.alert b{font-weight:800}

/* Donut */
.donut-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:370px){.donut-row{grid-template-columns:1fr;justify-items:center}}
.donut{width:140px;height:140px}
.donut text{fill:var(--ink);font-family:var(--display)}
.donut .sub{fill:var(--muted);font-family:var(--body);font-weight:600}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.88rem}
.legend .dot{width:10px;height:10px;border-radius:50%}
.legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.legend .r{text-align:right;white-space:nowrap}
.legend .r em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:6px;display:inline-block;min-width:3.2ch}

/* Semaines */
.wchart{display:grid;gap:8px;align-items:end;height:150px;padding-top:4px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.wcol .v{font-size:.72rem;font-weight:700;white-space:nowrap}
.wcol .b{width:100%;max-width:44px;border-radius:10px 10px 6px 6px;background:var(--c2);min-height:4px}
.wcol .b.zero{background:var(--sunk)}
.wcol .l{font-size:.72rem;color:var(--muted);white-space:nowrap}

/* Enveloppes */
.macs{display:flex;gap:14px;overflow-x:auto;margin-inline:-16px;padding:4px 16px 6px;scrollbar-width:none}
.mac{flex:none;width:78px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mac .disc{position:relative;width:72px;height:72px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.mac .disc svg.rg{position:absolute;inset:0;width:72px;height:72px}
.mac .disc svg.rg circle{fill:none;stroke-width:5}
.mac .pc{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:-.02em;position:relative}
.mac .pc small{font-size:.6em}
.mac .nm{font-size:.74rem;font-weight:700;line-height:1.2;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mac .am{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:-4px}
.tr{display:flex;flex-direction:column;gap:12px}
.tr .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tr .big{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;color:var(--c4)}
.tr .bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--c4) 18%,transparent);overflow:hidden}
.tr .bar i{display:block;height:100%;background:var(--c4);border-radius:99px}
.tr .meta{font-size:.84rem;color:var(--muted);font-weight:600}
.chip-tr{background:color-mix(in srgb,var(--c4) 22%,transparent);border-radius:6px;padding:0 6px;font-weight:700;color:var(--ink)}
.accs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acc{border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.acc .nm{font-weight:800;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .bal{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:-.02em;color:var(--ok)}
.acc .meta,.goal .meta{font-size:.78rem;color:var(--muted);font-weight:600}
.minibar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ok) 15%,transparent);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.acc-add{border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--muted);font-weight:700;justify-content:center;align-items:center;min-height:110px}
.goals{display:flex;flex-direction:column;gap:12px}
.goal{border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:22px;padding:16px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center;width:100%}
.goal .rg{width:62px;height:62px}.goal .rg circle{fill:none;stroke-width:7}
.goal .nm{font-weight:800;font-size:1rem}
.goal .need{font-size:.85rem;font-weight:700;color:var(--ink)}
.goal.done .need{color:var(--ok)}
.tot-card{background:var(--surface);box-shadow:var(--shadow);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:6px}
.tot-card .big{font-family:var(--display);font-weight:700;font-size:clamp(2rem,10vw,2.6rem);letter-spacing:-.03em;color:var(--ok);line-height:1.05}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.save{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.save .rg{width:64px;height:64px}
.save .rg circle{fill:none;stroke-width:7}
.save .amt{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1;color:var(--ok)}
.save .meta{font-size:.84rem;color:var(--muted);font-weight:600}
.catchip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 8px 6px 12px;font-weight:700;font-size:.84rem;align-self:flex-start}
.catchip span{width:20px;height:20px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;font-size:.8rem;line-height:1}
.envs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.env{border:0;text-align:left;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.env .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.env .name{font-weight:800;font-size:.95rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.env .left{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;line-height:1}
.env .of{font-size:.8rem;color:var(--muted);font-weight:600}
.ring{flex:none;width:34px;height:34px}
.ring circle{fill:none;stroke-width:5}
.ring .tr{stroke:rgba(127,120,150,.18)}
.env .flag{font-size:.75rem;font-weight:800;color:var(--bad)}
.env .flag.w{color:var(--warn)}
.env.over{outline:2px solid var(--bad);outline-offset:-2px}
.env-add{border:2px dashed var(--line);background:transparent;color:var(--muted);font-weight:700;justify-content:center;align-items:center;min-height:118px}

/* Lignes */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.rows li + li{border-top:1px solid var(--line)}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.ico svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rows .main{display:flex;flex-direction:column;min-width:0;text-align:left;border:0;background:none;padding:0}
.rows .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .sub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rows .amt{font-weight:800;text-align:right;white-space:nowrap}
.rows .amt.plus{color:var(--ok)}
.chip-env{background:var(--sunk);border-radius:6px;padding:0 6px;font-weight:600;color:var(--ink)}
.day-h{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--muted);padding:4px 2px 0}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.filters button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:99px;padding:7px 13px;font-size:.84rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.empty{padding:18px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li span{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.85rem}

/* Champs & boutons */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.85rem;font-weight:700}
.field input,.field select{font-size:16px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;width:100%;min-width:0;font-weight:600}
.field input:focus,.field select:focus{border-color:var(--c2);outline:none}
.field .amount-in{font-family:var(--display);font-size:1.6rem;font-weight:700;padding:14px;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catgrid button{border:1.5px solid transparent;background:var(--bg);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;font-weight:700;min-width:0}
.catgrid button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.catgrid button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.catgrid .ico{width:32px;height:32px;border-radius:11px}
.catgrid .ico svg{width:17px;height:17px}

/* Nav flottante */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:440px;margin:0 auto;background:var(--nav);border-radius:26px;display:grid;grid-template-columns:repeat(2,1fr) 64px repeat(2,1fr);align-items:center;padding:6px;box-shadow:0 10px 30px rgba(20,12,40,.3)}
nav.tabs .t{border:0;background:none;padding:8px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;color:var(--nav-ink)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .t[aria-current="page"]{color:var(--nav-on)}
.fab{justify-self:center;width:54px;height:54px;border-radius:50%;border:0;background:var(--hero);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(255,91,58,.45)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6}

/* Feuille */
.scrim{position:fixed;inset:0;background:rgba(20,16,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--display);font-size:1.1rem;font-weight:700}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.seg.kind{align-self:stretch}.seg.kind button{flex:1;padding:9px}
.seg.pay button{flex:1;padding:10px}
.seg.pay button[data-v="tr"][aria-pressed="true"]{background:var(--c4);color:#1F1A2E}
.err{color:var(--bad);font-weight:700;font-size:.88rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;display:flex;gap:14px;align-items:center;font-size:.9rem;font-weight:600;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--hero);font-weight:800}
.status{font-size:.78rem;color:var(--muted);text-align:center;margin:18px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="month">
      <button class="arrow" id="prev" aria-label="Mois précédent"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1 id="monthLabel">—</h1>
      <button class="arrow" id="next" aria-label="Mois suivant"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Revenus comptés">
      <button id="modePerso" aria-pressed="true">Perso</button>
      <button id="modeDeux" aria-pressed="false">À deux</button>
    </div>
  </div>
</header>

<main class="wrap" id="app" style="padding-top:6px"></main>
<p class="status" id="status"></p>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button class="t" data-tab="apercu"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Mois</button>
    <button class="t" data-tab="depenses"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>Dépenses</button>
    <button class="fab" id="fab" aria-label="Ajouter une dépense ou un revenu"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="t" data-tab="epargne"><svg viewBox="0 0 24 24"><path d="M5 11a7 6 0 0 1 13-2h2v4l-2 1v3h-3v-2H9v2H6v-3a6 6 0 0 1-1-3z"/><path d="M10 7h4"/><circle cx="15.5" cy="11" r=".6"/></svg>Épargne</button>
    <button class="t" data-tab="revenus"><svg viewBox="0 0 24 24"><path d="M12 3v18M17 7.5C17 5.6 14.8 5 12 5S7 6 7 8.2c0 4.6 10 2.4 10 7.3C17 17.6 14.8 19 12 19s-5-1-5-3"/></svg>Budget</button>
  </div>
</nav>

<script>
(function(){
// ---------- référentiels ----------
const I={
 logement:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>',
 energie:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',
 abos:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M10 9l5 2-5 2z"/>',
 courses:'<path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
 transport:'<path d="M5 16V9l2-4h10l2 4v7z"/><path d="M5 12h14"/><circle cx="8" cy="16" r="1.5"/><circle cx="16" cy="16" r="1.5"/>',
 resto:'<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1-3 4-3 7h3"/>',
 loisirs:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
 beaute:'<path d="M12 3c1 4 4 6 7 7-3 1-6 3-7 7-1-4-4-6-7-7 3-1 6-3 7-7z"/>',
 shopping:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
 sante:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 cadeaux:'<rect x="4" y="9" width="16" height="11" rx="1"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S12 9 12 9zM12 9c2-4 6-4 6-1.5S12 9 12 9z"/>',
 divers:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
 extra:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 devoirs:'<path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/>',
 epargne:'<path d="M5 11a7 6 0 0 1 13-2h2v4l-2 1v3h-3v-2H9v2H6v-3a6 6 0 0 1-1-3z"/><path d="M10 7h4"/>',
 rembours:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'};
const CATS=[
 {id:'logement',name:'Logement',c:'--c2'},{id:'energie',name:'Énergie',c:'--c4'},{id:'abos',name:'Abonnements',c:'--c8'},
 {id:'courses',name:'Courses',c:'--c3'},{id:'transport',name:'Transport',c:'--c6'},{id:'resto',name:'Restos & sorties',c:'--c1'},
 {id:'loisirs',name:'Loisirs',c:'--c7'},{id:'beaute',name:'Soins & beauté',c:'--c5'},{id:'shopping',name:'Shopping',c:'--c9'},
 {id:'sante',name:'Santé',c:'--c10'},{id:'cadeaux',name:'Cadeaux',c:'--c5'},{id:'divers',name:'Divers',c:'--c11'}];
const catById=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const INC=[{id:'prime',name:'Prime',c:'--c4',i:'loisirs'},{id:'vinted',name:'Vinted',c:'--c3',i:'shopping'},{id:'devoirs',name:'Aide aux devoirs',c:'--c2',i:'devoirs'},{id:'courses',name:'Courses rendues',c:'--c6',i:'courses'},{id:'rembours',name:'Rembour­sement',c:'--c8',i:'rembours'},{id:'cadeau',name:'Cadeau reçu',c:'--c5',i:'cadeaux'},{id:'autre',name:'Autre',c:'--c7',i:'extra'}];
const incById=id=>INC.find(c=>c.id===id)||INC[INC.length-1];
const incIcon=id=>{const c=incById(id);return `<span class="ico" style="background:color-mix(in srgb,var(${c.c}) 16%,transparent)"><svg viewBox="0 0 24 24" style="stroke:var(${c.c})">${I[c.i]}</svg></span>`};
const ENV_COLORS=[['--e1','--c1'],['--e2','--c2'],['--e3','--c3'],['--e4','--c4'],['--e5','--c5'],['--e6','--c6']];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MC=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const fmt=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const fmt0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const eur=n=>fmt.format(Math.round((n||0)*100)/100);
const eurS=n=>fmt0.format(Math.round(n||0))+' €';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const icon=(id,size)=>{const c=catById(id);return `<span class="ico" style="background:color-mix(in srgb,var(${c.c}) 16%,transparent)"><svg viewBox="0 0 24 24" style="stroke:var(${c.c})">${I[id]||I.divers}</svg></span>`};

// ---------- état ----------
const now=new Date();
let cur={y:now.getFullYear(),m:now.getMonth()};
let tab='apercu', weekFilter='all', catFilter=null, savingsAll=null, trCarry=null;
const DEFAULT_SETTINGS={mode:'perso',partnerName:'',lastSalary:null,lastPartnerSalary:null,envelopes:[],fixed:[]};
let settings=structuredClone(DEFAULT_SETTINGS), month=emptyMonth();
let loaded={settings:false,month:false};
function emptyMonth(){return {extras:[],expenses:[],savings:[]}}
const MK=()=>`${cur.y}-${pad(cur.m+1)}`;
const monthKey=()=>`m-${MK()}`;
const prevMK=k=>{let [y,m]=k.split('-').map(Number);m--;if(m<1){m=12;y--}return `${y}-${pad(m)}`};

// Charges fixes : chaque charge garde son historique de montants, pour que les mois passés ne bougent pas.
function normFixed(list){return (list||[]).map(f=>f.hist?f:{id:f.id,label:f.label,cat:f.cat,from:'2000-01',until:null,hist:[{from:'2000-01',amount:num(f.amount)}]})}
const fixedOn=(f,k)=>(f.from||'2000-01')<=k&&(!f.until||k<=f.until);
function fixedAmt(f,k){let a=0;[...(f.hist||[])].sort((x,y)=>x.from.localeCompare(y.from)).forEach(h=>{if(h.from<=k)a=num(h.amount)});return a}
const activeFixed=()=>normFixed(settings.fixed).filter(f=>fixedOn(f,MK())).map(f=>({...f,amount:fixedAmt(f,MK())}));

// ---------- stockage ----------
let db=null, userId=null, unsubMonth=null, mode='local';
const statusEl=document.getElementById('status');
function lsGet(k){try{const v=localStorage.getItem('budget:'+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('budget:'+k,JSON.stringify(v))}catch(e){}}
const chains={}, timers={};
function save(key,data){
  if(mode==='local'){lsSet(key,data);return}
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(data));
    chains[key]=(chains[key]||Promise.resolve()).then(()=>db.doc(`data/users/${userId}/${key}`).set(body)).catch(e=>{
      statusEl.textContent=e&&e.code==='invalid_argument'?"Enregistrement refusé : demande un accès « Contributeur » à cette page.":"Enregistrement impossible pour le moment. Réessaie dans un instant.";
    });
  },350);
}
const saveSettings=()=>{settings.fixed=normFixed(settings.fixed);save('settings',settings)};
const saveMonth=()=>{if(month.trCredit==null&&trOn())month.trCredit=num(settings.trMonthly);save(monthKey(),month);clearTimeout(timers.sa);timers.sa=setTimeout(refreshSavingsAll,1500)};
const trOn=()=>num(settings.trMonthly)>0;
const isTR=e=>e.pay==='tr';
const trCreditOf=(m,isCurrent)=>m&&m.trCredit!=null?num(m.trCredit):(isCurrent?num(settings.trMonthly):0);
const trSpentOf=m=>((m&&m.expenses)||[]).filter(isTR).reduce((a,x)=>a+num(x.amount),0);
const signed=x=>x.dir==='out'?-num(x.amount):num(x.amount);
const monthSavings=m=>((m&&m.savings)||[]).reduce((a,x)=>a+signed(x),0);
const ACC_TYPES={livretA:{name:'Livret A',cap:22950},livretJeune:{name:'Livret Jeune',cap:1600},ldds:{name:'LDDS',cap:12000},lep:{name:'LEP',cap:10000},autre:{name:'Autre épargne',cap:0}};
let accAll={};
const accOf=id=>(settings.accounts||[]).find(a=>a.id===id);
function accBalance(a){return num(a.initial)+(accAll[a.id]||0)+(month.savings||[]).filter(x=>x.acc===a.id).reduce((s,x)=>s+signed(x),0)}
function totalSavings(){const init=(settings.accounts||[]).reduce((s,a)=>s+num(a.initial),0);return savingsAll==null?null:init+savingsAll+monthSavings(month)}
async function refreshSavingsAll(){
  try{
    let sum=0,carry=0;const key=monthKey(),acc={};
    const take=(id,m)=>{if(!id.startsWith('m-')||id===key||!m)return;sum+=monthSavings(m);(m.savings||[]).forEach(x=>{const k=x.acc||'';acc[k]=(acc[k]||0)+signed(x)});if(id<key)carry+=trCreditOf(m,false)-trSpentOf(m)};
    if(mode==='db'){const snap=await db.collection(`data/users/${userId}`).get();snap.docs.forEach(d=>take(d.id,d.data()))}
    else{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('budget:m-'))take(k.slice(7),lsGet(k.slice(7)))}}
    savingsAll=sum;trCarry=carry;accAll=acc;if(tab==='apercu'||tab==='revenus'||tab==='epargne')render();
  }catch(e){}
}

function loadLocal(){
  settings=Object.assign(structuredClone(DEFAULT_SETTINGS),lsGet('settings')||{});
  month=Object.assign(emptyMonth(),lsGet(monthKey())||{});
  loaded={settings:true,month:true};render();refreshSavingsAll();
}
function subscribeMonth(){
  if(mode==='local'){month=Object.assign(emptyMonth(),lsGet(monthKey())||{});loaded.month=true;render();return}
  if(unsubMonth)unsubMonth();
  loaded.month=false;month=emptyMonth();render();
  const key=monthKey();
  unsubMonth=db.doc(`data/users/${userId}/${key}`).onSnapshot(s=>{
    if(key!==monthKey())return;
    if(s.metadata.hasPendingWrites&&loaded.month)return;
    month=Object.assign(emptyMonth(),s.exists?structuredClone(s.data()):{});loaded.month=true;render();
  },()=>{statusEl.textContent="Connexion perdue. Recharge la page.";});
}
function init(){
  loadLocal();
  statusEl.textContent="Données enregistrées sur ce téléphone. Exporte une sauvegarde de temps en temps.";
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}

// ---------- calculs ----------
function salaries(){
  const s=month.salary!=null?month.salary:(settings.lastSalary||0);
  const p=settings.mode==='deux'?(month.partnerSalary!=null?month.partnerSalary:(settings.lastPartnerSalary||0)):0;
  return {s,p};
}
function totals(){
  const {s,p}=salaries();
  const extras=(month.extras||[]).reduce((a,x)=>a+num(x.amount),0);
  const income=s+p+extras;
  const fixed=activeFixed().reduce((a,x)=>a+x.amount,0);
  const variable=(month.expenses||[]).filter(x=>!isTR(x)).reduce((a,x)=>a+num(x.amount),0);
  const saved=monthSavings(month);
  const trSpent=trSpentOf(month), trCredit=trCreditOf(month,true);
  return {income,extras,fixed,variable,saved,trSpent,trCredit,spent:fixed+variable,left:income-fixed-variable-saved};
}
function byCat(withTR){
  const m={};
  activeFixed().forEach(f=>m[f.cat]=(m[f.cat]||0)+f.amount);
  (month.expenses||[]).filter(e=>withTR||!isTR(e)).forEach(e=>m[e.cat]=(m[e.cat]||0)+num(e.amount));
  return CATS.map(c=>({...c,v:m[c.id]||0})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
}
function weeks(){
  const last=new Date(cur.y,cur.m+1,0).getDate(), out=[];let start=1;
  while(start<=last){const dow=(new Date(cur.y,cur.m,start).getDay()+6)%7;const end=Math.min(last,start+(6-dow));out.push({start,end});start=end+1}
  return out;
}
const dayOf=d=>parseInt(String(d||'').slice(8,10),10)||1;
const weekOf=day=>weeks().findIndex(w=>day>=w.start&&day<=w.end);
const envSpent=id=>(month.expenses||[]).filter(e=>e.env===id).reduce((a,e)=>a+num(e.amount),0);
function defaultDate(){const t=new Date();return (t.getFullYear()===cur.y&&t.getMonth()===cur.m)?`${cur.y}-${pad(cur.m+1)}-${pad(t.getDate())}`:`${cur.y}-${pad(cur.m+1)}-01`}
const shortDate=d=>`${dayOf(d)} ${MC[cur.m]}`;
const longDay=d=>{const day=dayOf(d);const w=JOURS[new Date(cur.y,cur.m,day).getDay()];return `${w[0].toUpperCase()+w.slice(1)} ${day}`};

// ---------- rendu ----------
const app=document.getElementById('app');
function render(){
  document.getElementById('monthLabel').innerHTML=`${MOIS[cur.m][0].toUpperCase()+MOIS[cur.m].slice(1)} <span>${cur.y}</span>`;
  document.getElementById('modePerso').setAttribute('aria-pressed',settings.mode!=='deux');
  document.getElementById('modeDeux').setAttribute('aria-pressed',settings.mode==='deux');
  document.querySelectorAll('nav.tabs .t').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(!loaded.settings||!loaded.month){app.innerHTML=`<div class="empty"><p class="hint">Chargement de ton budget…</p></div>`;return}
  app.innerHTML={apercu:vApercu,depenses:vDepenses,enveloppes:vEnveloppes,revenus:vRevenus,epargne:vEpargne}[tab]();
}

function alertsHtml(){
  const out=[], t=totals();
  if(t.income>0&&t.left<0)out.push(`<div class="alert"><span class="ic">!</span><span>${t.saved?'Dépenses et épargne dépassent':'Tes dépenses dépassent'} tes revenus de <b>${eur(-t.left)}</b> ce mois-ci.</span></div>`);
  (settings.envelopes||[]).forEach(e=>{
    const sp=envSpent(e.id), b=num(e.budget);
    if(b>0&&sp>b)out.push(`<div class="alert"><span class="ic">!</span><span><b>${esc(e.name)}</b> dépassée de <b>${eur(sp-b)}</b>.</span></div>`);
    else if(b>0&&sp>=b*.85)out.push(`<div class="alert warn"><span class="ic">!</span><span><b>${esc(e.name)}</b> presque vide : plus que <b>${eur(b-sp)}</b>.</span></div>`);
  });
  return out.length?`<div class="alerts">${out.join('')}</div>`:'';
}

function donutSvg(items,total,center,sub){
  const R=56,C=2*Math.PI*R,gap=items.length>1?2:0;let off=0;
  const segs=items.map(it=>{const len=total>0?it.v/total*C:0;const L=Math.max(0,len-gap);const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(${it.c})" stroke-width="16" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Répartition des dépenses"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="16"/>${segs}<text x="70" y="70" text-anchor="middle" font-size="22" font-weight="700">${center}</text><text class="sub" x="70" y="90" text-anchor="middle" font-size="10.5">${sub}</text></svg>`;
}

function vApercu(){
  const t=totals(), cats=byCat(), envs=settings.envelopes||[];
  if(!t.income&&!t.spent&&!t.saved&&!t.trSpent&&!envs.length&&!(settings.fixed||[]).length)return `
    <div class="empty"><h2>On met ton mois en place</h2>
    <ol class="steps"><li><span>1</span><div>Entre ton salaire dans <b>Budget</b>.</div></li>
    <li><span>2</span><div>Ajoute loyer, électricité et abonnements dans <b>Budget</b>, ils reviennent chaque mois.</div></li>
    <li><span>3</span><div>Crée tes enveloppes, par exemple Soins & beauté à 70 €.</div></li>
    <li><span>4</span><div>Note chaque dépense avec le <b>+</b>.</div></li></ol>
    <button class="btn" data-go="revenus">Entrer mon salaire</button></div>`;
  const macs=byCat(true);
  const pctSpent=t.income>0?Math.min(100,(t.spent+t.saved)/t.income*100):100;
  const base=Math.max(t.income,t.spent);
  const ws=weeks(), wTot=ws.map((w,i)=>(month.expenses||[]).filter(e=>weekOf(dayOf(e.date))===i).reduce((a,e)=>a+num(e.amount),0));
  const wMax=Math.max(1,...wTot);
  const legend=cats.map(c=>`<li><span class="dot" style="background:var(${c.c})"></span><span class="nm">${esc(c.name)}</span><span class="r">${eurS(c.v)}<em>${t.income>0?Math.round(c.v/t.income*100)+' %':''}</em></span></li>`).join('');
  return `
  <section class="hero ${t.left<0?'neg':''}">
    <div><div class="lab">Reste à vivre</div><div class="big">${t.left<0?'−':''}${fmt0.format(Math.floor(Math.round(Math.abs(t.left)*100)/100))}<small>,${pad(Math.round(Math.abs(t.left)*100)%100)} €</small></div></div>
    <div class="meter" aria-label="Part des revenus dépensée ou épargnée"><i style="width:${pctSpent}%"></i></div>
    <div class="trio"><div><span>Revenus</span><b>${eurS(t.income)}</b>${t.extras?`<span>dont +${eurS(t.extras)} en plus</span>`:''}</div><div><span>Dépensé</span><b>${eurS(t.spent)}</b><span>dont ${eurS(t.fixed)} de fixes</span></div><div><span>Épargné</span><b>${eurS(t.saved)}</b></div></div>
  </section>
  ${alertsHtml()}
  ${macs.length?`<section class="sec"><div class="sec-head"><h2>Tes dépenses en %</h2><span class="hint">sur ${eurS(t.spent+t.trSpent)} dépensés</span></div>
    <div class="macs">${macs.map(c=>macaron(c,t.spent+t.trSpent)).join('')}</div></section>`:''}
  ${trCard(t)}
  ${savingsCard(t)}
  <section class="sec"><div class="sec-head"><h2>Où part ton argent</h2><span class="hint">en % de tes revenus</span></div>
    <div class="card">${cats.length?`<div class="donut-row">${donutSvg(cats,base,t.income>0?Math.round(t.spent/t.income*100)+'%':'—','dépensé')}<ul class="legend">${legend}</ul></div>`:`<p class="hint">Rien de dépensé ce mois-ci pour l'instant.</p>`}</div></section>
  <section class="sec"><div class="sec-head"><h2>Semaine par semaine</h2><span class="hint">hors charges fixes</span></div>
    <div class="card"><div class="wchart" style="grid-template-columns:repeat(${ws.length},minmax(0,1fr))">${ws.map((w,i)=>`<div class="wcol"><span class="v">${wTot[i]?eurS(wTot[i]):''}</span><span class="b ${wTot[i]?'':'zero'}" style="height:${Math.max(4,wTot[i]/wMax*100)}px"></span><span class="l">${w.start}–${w.end}</span></div>`).join('')}</div></div></section>
  <section class="sec"><div class="sec-head"><h2>Enveloppes</h2><button class="link" data-go="enveloppes">Tout voir</button></div>

}

function macaron(c,total){
  const p=total>0?c.v/total*100:0, R=33,C=2*Math.PI*R, L=p/100*C;
  return `<button class="mac" data-cat="${c.id}" aria-label="${esc(c.name)} : ${Math.round(p)} %, ${eurS(c.v)}">
    <span class="disc"><svg class="rg" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${R}" stroke="color-mix(in srgb,var(${c.c}) 18%,transparent)"/><circle cx="36" cy="36" r="${R}" stroke="var(${c.c})" stroke-linecap="round" stroke-dasharray="${L} ${C}" transform="rotate(-90 36 36)"/></svg><span class="pc">${p<1&&p>0?'<1':Math.round(p)}<small>%</small></span></span>
    <span class="nm">${esc(c.name)}</span><span class="am">${eurS(c.v)}</span></button>`;

function trCard(t){
  if(!trOn()&&!t.trSpent)return '';
  const carry=trCarry||0, avail=t.trCredit+carry, left=avail-t.trSpent, r=avail>0?Math.min(1,t.trSpent/avail):0;
  return `<section class="sec"><div class="sec-head"><h2>Tickets resto</h2><button class="link" id="addTR">Payer en ticket resto</button></div>
    <div class="card tr"><div class="row"><span class="big" style="${left<0?'color:var(--bad)':''}">${eur(left)}</span><span class="meta">restant</span></div>
    <div class="bar"><i style="width:${r*100}%"></i></div>
    <div class="meta">${eur(t.trSpent)} utilisés sur ${eur(avail)}${carry?` (dont ${eur(carry)} reportés des mois d'avant)`:''}. Ces dépenses ne touchent pas ton reste à vivre.</div></div></section>`;
}
function savingsCard(t){
  const goal=num(settings.savingsGoal), r=goal>0?Math.min(1,t.saved/goal):0, R=27,C=2*Math.PI*R;
  const total=totalSavings();

    <div class="card"><div class="save">
      <svg class="rg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${R}" stroke="color-mix(in srgb,var(--ok) 18%,transparent)"/><circle cx="32" cy="32" r="${R}" stroke="var(--ok)" stroke-linecap="round" stroke-dasharray="${goal>0?r*C:(t.saved>0?C:0)} ${C}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--ink);font-family:var(--display)">${t.income>0?Math.round(t.saved/t.income*100):0}%</text></svg>
      <div><div class="amt">${eur(t.saved)}</div>
      <div class="meta">${t.income>0?`${Math.round(t.saved/t.income*100)} % de tes revenus`:'mis de côté'}${goal>0?` · objectif ${eurS(goal)}${t.saved>=goal?' atteint':''}`:''}</div>
      ${total!=null&&total>0?`<div class="meta">${eurS(total)} sur tes livrets au total</div>`:''}</div>
    </div></div></section>`;
}
const monthsUntil=d=>{const t=new Date(),g=new Date(d+'T12:00:00');return Math.max(0,(g.getFullYear()-t.getFullYear())*12+(g.getMonth()-t.getMonth()))};
const longDate=d=>{const g=new Date(d+'T12:00:00');return `${g.getDate()} ${MOIS[g.getMonth()]} ${g.getFullYear()}`};
function vEpargne(){
  const t=totals(), accs=settings.accounts||[], goals=settings.goals||[], total=totalSavings();
  const mv=[...(month.savings||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const accCard=a=>{const b=accBalance(a),ty=ACC_TYPES[a.type]||ACC_TYPES.autre,cap=ty.cap,r=num(a.rate);
    return `<button class="acc" data-acc="${esc(a.id)}"><span class="nm">${esc(a.name||ty.name)}</span><span class="bal">${eur(b)}</span>
    ${cap?`<span class="minibar"><i style="width:${Math.min(100,Math.max(0,b/cap*100))}%"></i></span><span class="meta">${Math.round(Math.max(0,b)/cap*100)} % du plafond (${eurS(cap)})</span>`:''}
    ${r?`<span class="meta">≈ ${eur(b*r/100)} d'intérêts par an à ${String(r).replace('.',',')} %</span>`:''}</button>`};
  const goalCard=g=>{
    const cur=g.acc&&accOf(g.acc)?accBalance(accOf(g.acc)):(total||0), target=num(g.target), p=target>0?Math.min(1,Math.max(0,cur/target)):0, R=26,C=2*Math.PI*R;
    const left=Math.max(0,target-cur), m=monthsUntil(g.date), done=cur>=target;
    const need=done?'Objectif atteint':m<=0?`Échéance passée, il manque ${eur(left)}`:`Mets ${eur(left/m)} par mois pour y arriver`;
    return `<button class="goal ${done?'done':''}" data-goal="${esc(g.id)}">
      <svg class="rg" viewBox="0 0 62 62"><circle cx="31" cy="31" r="${R}" stroke="color-mix(in srgb,var(--c5) 18%,transparent)"/><circle cx="31" cy="31" r="${R}" stroke="${done?'var(--ok)':'var(--c5)'}" stroke-linecap="round" stroke-dasharray="${p*C} ${C}" transform="rotate(-90 31 31)"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ink);font-family:var(--display)">${Math.round(p*100)}%</text></svg>
      <div><div class="nm">${esc(g.name)}</div><div class="meta">${eur(cur)} sur ${eur(target)} · d'ici le ${longDate(g.date)}</div><div class="need">${need}</div>

  return `<section class="tot-card"><span class="hint" style="font-weight:700">Toute mon épargne</span><span class="big">${total==null?'…':eur(total)}</span>

    ${goals.length?`<div class="goals">${goals.map(goalCard).join('')}</div>`:`<div class="empty"><p class="hint">Fixe-toi un objectif : un montant et une date. L'appli calcule combien mettre de côté chaque mois.</p><button class="btn soft" id="addGoal">Créer un objectif</button></div>`}</section>
  <section class="sec"><div class="sec-head"><h2>Mouvements de ${MOIS[cur.m]}</h2><span class="tot" style="color:var(--ok)">${t.saved>=0?'+':'−'}${eur(Math.abs(t.saved))}</span></div>

    </div>
    <div class="field"><label for="sgoal">Objectif de versement par mois (facultatif)</label><input id="sgoal" inputmode="decimal" value="${settings.savingsGoal??''}" placeholder="ex. 150"></div></section>`;

function envCard(e,i){

  return `<button class="env ${r>1?'over':''}" data-env="${esc(e.id)}" style="background:var(${bg})">
    <div class="top"><span class="name">${esc(e.name)}</span>
    <svg class="ring" viewBox="0 0 34 34"><circle class="tr" cx="17" cy="17" r="${R}"/><circle cx="17" cy="17" r="${R}" stroke="${stroke}" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 17 17)"/></svg></div>

// ---------- feuille de saisie ----------
let sheetEl=null;
function openSheet({title,fields,onSave,onDelete,deleteLabel,note,kind}){
  closeSheet();
  const scrim=document.createElement('div');scrim.className='scrim';
  const html=fd=>{
    if(fd.type==='cat')return `<div class="field"><label>${esc(fd.label)}</label><div class="catgrid" data-field="${fd.id}">${(fd.opts||CATS).map(c=>`<button type="button" data-v="${c.id}" aria-pressed="${c.id===fd.value}">${(fd.ico||icon)(c.id)}<span>${esc(c.name)}</span></button>`).join('')}</div><input type="hidden" id="f_${fd.id}" value="${esc(fd.value)}"></div>`;
    if(fd.type==='color')return `<div class="field"><label>${esc(fd.label)}</label><div class="swatches" data-field="${fd.id}">${ENV_COLORS.map((c,i)=>`<button type="button" data-v="${i}" aria-label="Couleur ${i+1}" aria-pressed="${i===fd.value}" style="background:var(${c[0]});box-shadow:inset 0 0 0 6px var(${c[0]}),inset 0 0 0 20px var(${c[1]})"></button>`).join('')}</div><input type="hidden" id="f_${fd.id}" value="${fd.value}"></div>`;
    if(fd.type==='seg')return `<div class="field"><label>${esc(fd.label)}</label><div class="seg pay" data-field="${fd.id}">${fd.options.map(o=>`<button type="button" data-v="${esc(o.v)}" aria-pressed="${o.v===fd.value}">${esc(o.t)}</button>`).join('')}</div><input type="hidden" id="f_${fd.id}" value="${esc(fd.value)}"></div>`;
    if(fd.type==='select')return `<div class="field"><label for="f_${fd.id}">${esc(fd.label)}</label><select id="f_${fd.id}">${fd.options.map(o=>`<option value="${esc(o.v)}" ${o.v===fd.value?'selected':''}>${esc(o.t)}</option>`).join('')}</select></div>`;
    return `<div class="field"><label for="f_${fd.id}">${esc(fd.label)}</label><input id="f_${fd.id}" class="${fd.big?'amount-in':''}" ${fd.type==='amount'?'inputmode="decimal"':fd.type==='date'?'type="date"':''} value="${esc(fd.value??'')}" placeholder="${esc(fd.ph||'')}"></div>`;
  };
  const parts=[];for(let i=0;i<fields.length;i++){const fd=fields[i];if(fd.half&&fields[i+1]&&fields[i+1].half){parts.push(`<div class="grid2">${html(fd)}${html(fields[i+1])}</div>`);i++}else parts.push(html(fd))}
  scrim.innerHTML=`<form class="sheet" novalidate><span class="grab"></span>${kind?`<div class="seg kind" role="group" aria-label="Type"><button type="button" data-kind="exp" aria-pressed="${kind==='exp'}">Dépense</button><button type="button" data-kind="inc" aria-pressed="${kind==='inc'}">Revenu</button><button type="button" data-kind="sav" aria-pressed="${kind==='sav'}">Épargne</button></div>`:''}<h2>${esc(title)}</h2>${parts.join('')}${note?`<p class="hint">${note}</p>`:''}<p class="err" id="sheetErr" hidden></p>
    <div class="btn-row"><button type="submit" class="btn">Enregistrer</button></div>
    <div class="btn-row">${onDelete?`<button type="button" class="btn soft" id="sDel">${esc(deleteLabel||'Supprimer')}</button>`:''}<button type="button" class="btn soft" id="sCancel">Annuler</button></div></form>`;
  document.body.appendChild(scrim);sheetEl=scrim;
  scrim.addEventListener('click',e=>{
    if(e.target===scrim){closeSheet();return}
    const k=e.target.closest('[data-kind]');
    if(k&&k.dataset.kind!==kind){const a=scrim.querySelector('#f_amount').value;({inc:extraSheet,sav:saveSheet,exp:expenseSheet}[k.dataset.kind])(null,a);return}
    const opt=e.target.closest('[data-field] button');
    if(opt){const box=opt.parentElement;box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===opt));scrim.querySelector('#f_'+box.dataset.field).value=opt.dataset.v}
  });
  scrim.querySelector('#sCancel').onclick=closeSheet;
  if(onDelete){const d=scrim.querySelector('#sDel');d.onclick=()=>{if(d.dataset.armed){onDelete();closeSheet()}else{d.dataset.armed='1';d.textContent='Confirmer';d.className='btn danger'}}}
  scrim.querySelector('form').addEventListener('submit',e=>{
    e.preventDefault();
    const vals={};fields.forEach(fd=>vals[fd.id]=scrim.querySelector('#f_'+fd.id).value.trim());
    const err=onSave(vals);
    if(err){const el=scrim.querySelector('#sheetErr');el.textContent=err;el.hidden=false;return}
    closeSheet();
  });
  const first=scrim.querySelector('input:not([type=hidden]),select');if(first)setTimeout(()=>first.focus(),60);
}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}}
const envOpts=()=>[{v:'',t:'Aucune'}].concat((settings.envelopes||[]).map(e=>({v:e.id,t:e.name})));
const inMonth=d=>d&&d.startsWith(MK());

function expenseSheet(existing,amt,pay){
  const e=existing||{date:defaultDate(),cat:pay==='tr'?'resto':'courses',env:'',amount:amt||'',pay:pay||'compte'};
  const payField=[{id:'pay',label:'Payé avec',type:'seg',options:[{v:'compte',t:'Mon compte'},{v:'tr',t:'Ticket resto'}],value:isTR(e)?'tr':'compte'}];
  openSheet({kind:existing?null:'exp',title:existing?'Modifier la dépense':'Nouvelle dépense',fields:[
    {id:'amount',label:'Montant',type:'amount',value:e.amount??'',ph:'0,00 €',big:true},
    ...payField,
    {id:'label',label:'Libellé',value:e.label||'',ph:'Carrefour, ciné, coiffeur…'},
    {id:'cat',label:'Catégorie',type:'cat',value:e.cat},
    {id:'date',label:'Date',type:'date',value:e.date,half:true},
    {id:'env',label:'Enveloppe',type:'select',options:envOpts(),value:e.env||'',half:true}],
    onSave:v=>{
      const amount=num(v.amount);if(amount<=0)return "Indique un montant supérieur à 0.";
      if(!inMonth(v.date))return `Choisis une date en ${MOIS[cur.m]} ${cur.y}.`;
      const rec={id:e.id||uid(),amount,date:v.date,label:v.label,cat:v.cat,env:v.env};if(v.pay==='tr')rec.pay='tr';
      if(rec.pay==='tr'&&!trOn()&&month.trCredit==null)setTimeout(()=>toast('Pense à indiquer ton crédit ticket resto dans Budget.'),5200);
      month.expenses=(month.expenses||[]).filter(x=>x.id!==rec.id).concat(rec);saveMonth();render();
      if(!existing)toast(`${eur(amount)} ajoutés.`);
    },
    onDelete:existing?()=>removeWithUndo('expenses',existing):null});
}
function extraSheet(existing,amt){
  const x=existing||{date:defaultDate(),kind:'vinted',amount:amt||''};
  openSheet({kind:existing?null:'inc',title:existing?'Modifier le revenu':'Nouveau revenu en plus',fields:[
    {id:'amount',label:'Montant',type:'amount',value:x.amount??'',ph:'0,00 €',big:true},
    {id:'kind',label:'Type',type:'cat',opts:INC,ico:incIcon,value:x.kind||'autre'},
    {id:'label',label:'Détail (facultatif)',value:x.label||'',ph:'Robe vendue, prime de fin d\'année…',half:true},
    {id:'date',label:'Date',type:'date',value:x.date,half:true}],
    onSave:v=>{
      const amount=num(v.amount);if(amount<=0)return "Indique un montant supérieur à 0.";
      if(!inMonth(v.date))return `Choisis une date en ${MOIS[cur.m]} ${cur.y}.`;
      const rec={id:x.id||uid(),kind:v.kind,label:v.label,amount,date:v.date};
      month.extras=(month.extras||[]).filter(r=>r.id!==rec.id).concat(rec);saveMonth();render();
      if(!existing)toast(`+${eur(amount)} ajoutés aux revenus.`);
    },
    onDelete:existing?()=>removeWithUndo('extras',existing):null});
}
function envSheet(existing){
  const list=settings.envelopes||[];
  const e=existing||{color:list.length%ENV_COLORS.length};
  openSheet({title:existing?"Modifier l'enveloppe":'Nouvelle enveloppe',fields:[
    {id:'name',label:'Nom',value:e.name||'',ph:'Soins & beauté, activités en couple…'},
    {id:'budget',label:'Budget par mois',type:'amount',value:e.budget??'',ph:'70 €'},
    {id:'color',label:'Couleur',type:'color',value:e.color??list.indexOf(e)}],
    onSave:v=>{
      if(!v.name)return "Donne un nom à l'enveloppe.";
      const budget=num(v.budget);if(budget<=0)return "Indique un budget supérieur à 0.";
      const rec={id:e.id||uid(),name:v.name,budget,color:parseInt(v.color,10)||0};
      const i=list.findIndex(x=>x.id===rec.id);if(i>=0)list[i]=rec;else list.push(rec);
      settings.envelopes=list;saveSettings();render();
    },
    onDelete:existing?()=>{settings.envelopes=list.filter(x=>x.id!==e.id);saveSettings();render();toast(`Enveloppe « ${e.name} » supprimée.`)}:null});
}
function fixedSheet(existing){
  const k=MK(), all=normFixed(settings.fixed);
  const f=existing?all.find(x=>x.id===existing.id):{cat:'logement'};
  const label=`${MOIS[cur.m]} ${cur.y}`;
  openSheet({title:existing?'Modifier la charge fixe':'Nouvelle charge fixe',
    note:existing?`Un nouveau montant s'applique à partir de ${label}. Les mois d'avant gardent l'ancien.`:`Comptée à partir de ${label}, puis chaque mois.`,
    fields:[
    {id:'amount',label:'Montant par mois',type:'amount',value:existing?fixedAmt(f,k):'',ph:'0,00 €',big:true},
    {id:'label',label:'Libellé',value:f.label||'',ph:'Loyer, EDF, Netflix…'},
    {id:'cat',label:'Catégorie',type:'cat',value:f.cat}],
    onSave:v=>{
      if(!v.label)return "Donne un nom à la charge.";
      const amount=num(v.amount);if(amount<=0)return "Indique un montant supérieur à 0.";
      if(existing){
        f.label=v.label;f.cat=v.cat;
        if(amount!==fixedAmt(f,k)){f.hist=(f.hist||[]).filter(h=>h.from!==k).concat({from:k,amount}).sort((a,b)=>a.from.localeCompare(b.from))}
      }else{all.push({id:uid(),label:v.label,cat:v.cat,from:k,until:null,hist:[{from:k,amount}]})}
      settings.fixed=all;saveSettings();render();
    },
    deleteLabel:'Arrêter à partir de ce mois',
    onDelete:existing?()=>{
      if(f.from>=k){settings.fixed=all.filter(x=>x.id!==f.id)}else{f.until=prevMK(k);f.hist=(f.hist||[]).filter(h=>h.from<k);settings.fixed=all}
      saveSettings();render();toast(`« ${f.label} » arrêtée à partir de ${label}.`);
    }:null});
}
function saveSheet(existing,amt,dir){
  const accs=settings.accounts||[];
  const x=existing||{date:defaultDate(),amount:amt||'',dir:dir||'in',acc:accs[0]?.id||''};
  openSheet({kind:existing?null:'sav',title:existing?'Modifier le mouvement':'Épargne',fields:[
    {id:'amount',label:'Montant',type:'amount',value:x.amount??'',ph:'0,00 €',big:true},
    {id:'dir',label:'Type',type:'seg',options:[{v:'in',t:'Versement'},{v:'out',t:'Retrait'}],value:x.dir==='out'?'out':'in'},
    {id:'acc',label:'Livret',type:'select',options:[{v:'',t:'Non classé'}].concat(accs.map(a=>({v:a.id,t:a.name}))),value:x.acc||''},
    {id:'label',label:'Note (facultatif)',value:x.label||'',ph:'Prime placée, vacances…',half:true},
    {id:'date',label:'Date',type:'date',value:x.date,half:true}],
    note:accs.length?"Un versement est retiré du reste à vivre, un retrait y est rajouté.":"Astuce : ajoute tes livrets dans l'onglet Épargne pour suivre leur solde.",
    onSave:v=>{
      const amount=num(v.amount);if(amount<=0)return "Indique un montant supérieur à 0.";
      if(!inMonth(v.date))return `Choisis une date en ${MOIS[cur.m]} ${cur.y}.`;
      const rec={id:x.id||uid(),label:v.label,amount,date:v.date,acc:v.acc,dir:v.dir};
      month.savings=(month.savings||[]).filter(r=>r.id!==rec.id).concat(rec);saveMonth();render();
      if(!existing)toast(v.dir==='out'?`${eur(amount)} retirés.`:`${eur(amount)} mis de côté.`);
    },
    onDelete:existing?()=>removeWithUndo('savings',existing):null});
}
function accSheet(existing,preset){
  const list=settings.accounts||[];
  const a=existing||{type:preset||'livretA'};
  openSheet({title:existing?'Modifier le livret':'Nouveau livret',fields:[
    {id:'type',label:'Type',type:'select',options:Object.entries(ACC_TYPES).map(([k,v])=>({v:k,t:v.name})),value:a.type||'autre'},
    {id:'name',label:'Nom affiché',value:a.name||'',ph:'Laisse vide pour garder le type'},
    {id:'initial',label:'Solde actuel avant de commencer',type:'amount',value:a.initial??'',ph:'0,00 €',half:true},
    {id:'rate',label:'Taux (%) facultatif',type:'amount',value:a.rate??'',ph:'ex. 1,7',half:true}],
    note:"Mets le solde que tu as aujourd'hui sur ce livret. Les versements et retraits notés ensuite s'y ajoutent.",
    onSave:v=>{
      const rec={id:a.id||uid(),type:v.type,name:v.name||ACC_TYPES[v.type].name,initial:num(v.initial)};
      if(v.rate!=='')rec.rate=num(v.rate);
      const i=list.findIndex(x=>x.id===rec.id);if(i>=0)list[i]=rec;else list.push(rec);
      settings.accounts=list;saveSettings();render();
    },
    onDelete:existing?()=>{settings.accounts=list.filter(x=>x.id!==a.id);saveSettings();render();toast(`${a.name} supprimé. Ses mouvements passent en « Non classé ».`)}:null});
}
function goalSheet(existing){
  const list=settings.goals||[], accs=settings.accounts||[];
  const d=new Date();d.setFullYear(d.getFullYear()+1);
  const g=existing||{date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,acc:''};
  openSheet({title:existing?"Modifier l'objectif":'Nouvel objectif',fields:[
    {id:'target',label:'Montant à atteindre',type:'amount',value:g.target??'',ph:'0,00 €',big:true},
    {id:'name',label:'Pour quoi',value:g.name||'',ph:'Vacances, permis, coussin de sécurité…'},
    {id:'date',label:'Date limite',type:'date',value:g.date,half:true},
    {id:'acc',label:'Suivi sur',type:'select',options:[{v:'',t:'Toute mon épargne'}].concat(accs.map(a=>({v:a.id,t:a.name}))),value:g.acc||'',half:true}],
    onSave:v=>{
      if(!v.name)return "Donne un nom à ton objectif.";
      const target=num(v.target);if(target<=0)return "Indique un montant supérieur à 0.";
      if(!v.date)return "Choisis une date limite.";
      const rec={id:g.id||uid(),name:v.name,target,date:v.date,acc:v.acc};
      const i=list.findIndex(x=>x.id===rec.id);if(i>=0)list[i]=rec;else list.push(rec);
      settings.goals=list;saveSettings();render();
    },
    onDelete:existing?()=>{settings.goals=list.filter(x=>x.id!==g.id);saveSettings();render();toast('Objectif supprimé.')}:null});
}
function removeWithUndo(field,item){
  month[field]=(month[field]||[]).filter(x=>x.id!==item.id);saveMonth();render();
  toast('Supprimé.',()=>{month[field]=(month[field]||[]).concat(item);saveMonth();render()});
}
let toastT=null;
function toast(msg,undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove());clearTimeout(toastT);
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button">Annuler</button>':''}`;
  document.body.appendChild(t);
  if(undo)t.querySelector('button').onclick=()=>{undo();t.remove()};
  toastT=setTimeout(()=>t.remove(),5000);
}

// ---------- événements ----------
document.getElementById('prev').onclick=()=>{cur.m--;if(cur.m<0){cur.m=11;cur.y--}weekFilter='all';catFilter=null;savingsAll=null;trCarry=null;subscribeMonth();refreshSavingsAll()};
document.getElementById('next').onclick=()=>{cur.m++;if(cur.m>11){cur.m=0;cur.y++}weekFilter='all';catFilter=null;savingsAll=null;trCarry=null;subscribeMonth();refreshSavingsAll()};
document.getElementById('modePerso').onclick=()=>{if(settings.mode!=='perso'){settings.mode='perso';saveSettings();render()}};
document.getElementById('modeDeux').onclick=()=>{if(settings.mode!=='deux'){settings.mode='deux';saveSettings();render()}};
document.querySelectorAll('nav.tabs .t').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;catFilter=null;render();window.scrollTo(0,0)});
document.getElementById('fab').onclick=()=>expenseSheet(null);

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-env],[data-exp],[data-extra],[data-fixed],[data-week],[data-cat],[data-save],#addEnv,#addExtra,#addFixed,#addExp,#addSave,#clearCat,#addTR,[data-acc],[data-goal],[data-preset],#addAcc,#addGoal,#withdraw');
  if(!el)return;
  if(el.dataset.go){tab=el.dataset.go;render();return}
  if(el.dataset.week){weekFilter=el.dataset.week;render();return}
  if(el.dataset.cat){catFilter=el.dataset.cat;weekFilter='all';tab='depenses';render();window.scrollTo(0,0);return}
  if(el.dataset.save){saveSheet((month.savings||[]).find(x=>x.id===el.dataset.save));return}
  if(el.id==='clearCat'){catFilter=null;render();return}
  if(el.id==='addSave'){saveSheet(null);return}
  if(el.id==='withdraw'){saveSheet(null,'','out');return}
  if(el.dataset.acc){accSheet(accOf(el.dataset.acc));return}
  if(el.dataset.goal){goalSheet((settings.goals||[]).find(g=>g.id===el.dataset.goal));return}
  if(el.dataset.preset){accSheet(null,el.dataset.preset);return}
  if(el.id==='addAcc'){accSheet(null,'autre');return}
  if(el.id==='addGoal'){goalSheet(null);return}
  if(el.id==='addTR'){expenseSheet(null,'','tr');return}
  if(el.dataset.env){envSheet((settings.envelopes||[]).find(x=>x.id===el.dataset.env));return}
  if(el.dataset.exp){expenseSheet((month.expenses||[]).find(x=>x.id===el.dataset.exp));return}
  if(el.dataset.extra){extraSheet((month.extras||[]).find(x=>x.id===el.dataset.extra));return}
  if(el.dataset.fixed){fixedSheet({id:el.dataset.fixed});return}
  if(el.id==='addEnv')envSheet(null);
  if(el.id==='addExtra')extraSheet(null);
  if(el.id==='addFixed')fixedSheet(null);
  if(el.id==='addExp')expenseSheet(null);
});
app.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='salary'||id==='psalary'){
    const raw=e.target.value.trim(), field=id==='salary'?'salary':'partnerSalary', lastF=id==='salary'?'lastSalary':'lastPartnerSalary';
    if(raw===''){delete month[field]}else{const n=num(raw);month[field]=n;settings[lastF]=n;saveSettings()}
    saveMonth();render();
  }
  if(id==='trm'){const r=e.target.value.trim();if(r==='')delete settings.trMonthly;else settings.trMonthly=num(r);saveSettings();render()}
  if(id==='trc'){const r=e.target.value.trim();if(r==='')delete month.trCredit;else month.trCredit=num(r);save(monthKey(),month);render()}
  if(id==='sgoal'){const r=e.target.value.trim();if(r==='')delete settings.savingsGoal;else settings.savingsGoal=num(r);saveSettings();render()}
  if(id==='pname'){settings.partnerName=e.target.value.trim();saveSettings();render()}
});

function exportData(){
  const out={app:'budget-enveloppes',version:1,exportedAt:new Date().toISOString(),data:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('budget:'))out.data[k.slice(7)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`budget-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('Sauvegarde exportée.');
}
let pendingImport=null;
app.addEventListener('click',e=>{
  if(e.target.id==='exportBtn')exportData();
  if(e.target.id==='importBtn'){
    if(pendingImport){
      try{Object.keys(localStorage).filter(k=>k.startsWith('budget:')).forEach(k=>localStorage.removeItem(k));
        Object.entries(pendingImport).forEach(([k,v])=>localStorage.setItem('budget:'+k,JSON.stringify(v)));}catch(err){}
      pendingImport=null;loadLocal();toast('Sauvegarde importée.');return;
    }
    document.getElementById('importFile').click();
  }
});
app.addEventListener('change',e=>{
  if(e.target.id!=='importFile'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    const err=document.getElementById('importErr');
    try{const j=JSON.parse(r.result);if(!j||j.app!=='budget-enveloppes'||!j.data)throw 0;
      pendingImport=j.data;const b=document.getElementById('importBtn');b.textContent='Confirmer : remplace tout';b.className='btn danger';
      err.hidden=false;err.textContent=`Fichier du ${String(j.exportedAt||'').slice(0,10)} prêt. Il remplacera toutes les données actuelles.`;
    }catch(x){err.hidden=false;err.textContent="Ce fichier n'est pas une sauvegarde de l'appli budget.";}
  };
  r.readAsText(e.target.files[0]);
});
render();init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
